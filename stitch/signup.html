<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - TOEFL Prep 2026</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {

                      "surface-tint": "#2a6a4a",
                      "on-error": "#ffffff",
                      "on-primary-container": "#aceec5",
                      "tertiary": "#733e00",
                      "on-primary": "#ffffff",
                      "on-tertiary-fixed-variant": "#6c3a00",
                      "on-error-container": "#93000a",
                      "on-surface-variant": "#404942",
                      "secondary": "#5f5f59",

                      "error-container": "#ffdad6",
                      "on-background": "#1b1c1c",

                      "inverse-on-surface": "#f3f0f0",

              },
              "borderRadius": {

              },
              "spacing": {

                      "unit": "8px",
                      "gutter": "24px",
                      "container-max": "1120px",
                      "margin-mobile": "16px"
              },
              "fontFamily": {
                      "headline-lg-mobile": [
                              "Playfair Display"
                      ],
                      "headline-md": [

                      ],
                      "label-md": [

              "fontSize": {

          },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-pattern {
            background-image: radial-gradient(var(--tw-colors-surface-variant) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-[#F6F4EC] text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center relative bg-pattern">
<!-- Ambient Background Elements to soften the utilitarian look -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary opacity-[0.03] rounded-full blur-3xl"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-tertiary-container opacity-[0.03] rounded-full blur-3xl"></div>
</div>
<main class="w-full max-w-md px-margin-mobile md:px-0 relative z-10">
<!-- Brand Header for Signup context -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">TOEFL Prep 2026</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Begin your academic journey.</p>
</div>
<!-- Signup Card - Notebook Style (Level 1 Elevation) -->
<div class="bg-surface border border-[#E5E2D0] rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] overflow-hidden">
<div class="p-8 md:p-10">
<form action="#" class="space-y-6" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="name">Full Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-surface-variant rounded-md bg-surface text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm font-body-md" id="name" name="name" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email Address -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-surface-variant rounded-md bg-surface text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm font-body-md" id="email" name="email" placeholder="you@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-surface-variant rounded-md bg-surface text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm font-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start">
<div class="flex h-5 items-center">
<input class="h-4 w-4 rounded border-surface-variant text-primary focus:ring-primary bg-surface cursor-pointer" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-label-sm text-on-surface-variant" for="terms">
                                I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms and Conditions</a> and <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.
                            </label>
</div>
</div>
<!-- Submit Button - Primary Action -->
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-on-primary bg-primary hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary font-label-md text-label-md transition-colors duration-200" type="submit">
                            Create Account
                        </button>
</div>
</form>
<!-- Divider -->
<div class="mt-8 relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-[#E5E2D0]"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-surface px-4 font-label-sm text-label-sm text-on-surface-variant">or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="mt-6 grid grid-cols-2 gap-4">
<a class="flex justify-center items-center w-full py-2.5 px-4 border border-surface-variant rounded-md shadow-sm bg-surface font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors duration-200 group" href="#">
<span class="material-symbols-outlined text-[18px] mr-2 text-on-surface-variant group-hover:text-on-surface transition-colors" data-icon="login">login</span>
<span>Google</span>
</a>
<a class="flex justify-center items-center w-full py-2.5 px-4 border border-surface-variant rounded-md shadow-sm bg-surface font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors duration-200 group" href="#">
<span class="material-symbols-outlined text-[18px] mr-2 text-on-surface-variant group-hover:text-on-surface transition-colors" data-icon="apple">file_download</span>
<span>Apple</span>
</a>
</div>
</div>
<!-- Card Footer / Login Link -->
<div class="px-8 py-6 bg-surface-container-low border-t border-[#E5E2D0] text-center">
<p class="font-body-md text-label-md text-on-surface-variant">
                    Already have an account? 
                    <a class="font-medium text-primary hover:text-primary-container transition-colors ml-1" href="#">Log in</a>
</p>
</div>
</div>
</main>
</body></html>
